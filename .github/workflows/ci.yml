name: Validate learning materials

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-docs.txt -r requirements-labs.txt
      - name: Enforce public/private boundary
        run: python scripts/check_public_tree.py
      - name: Run offline lab tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exam JavaScript and question bank
        run: |
          node --check docs/assets/javascripts/test-core.js
          node --check docs/assets/javascripts/test-runner.js
          node --test tests_js/*.test.cjs
      - name: Build documentation
        run: mkdocs build --strict
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
